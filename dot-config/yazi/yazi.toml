[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
wrap        = "no"
tab_size    = 2
max_width   = 600
max_height  = 900
image_delay = 30

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', desc = "Open in editor", block = true },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", orphan = true },
]
